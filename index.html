:root {

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.5; }

.lock { max-width: 380px; margin: 18vh auto 0; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
.lock h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
.lock p { margin: 0; color: var(--color-fg-muted); font-size: 14.5px; }

.lock button { font: inherit; font-weight: 600; padding: 12px 14px; border: 0; border-radius: 10px; background: var(--color-fg); color: var(--color-bg); cursor: pointer; }
.lock input:focus-visible, .lock button:focus-visible { outline: 2px solid var(--chart-1); outline-offset: 2px; }
.lock .err { color: var(--color-bad); min-height: 1.4em; }

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function openWith(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BOX.salt), iterations: BOX.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.iv) }, key, b64(BOX.data));
  return new TextDecoder().decode(plain);
}
async function attempt(pw, remember) {
  try {
    const page = await openWith(pw);
    if (remember) { try { localStorage.setItem('yp-pw', pw); } catch (e) {} }
    document.open(); document.write(page); document.close();
    return true;
  } catch (e) { return false; }
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem('yp-pw'); } catch (e) {}
  if (saved && await attempt(saved, false)) return;
  const pw = document.getElementById('pw'), err = document.getElementById('err');
  const submit = async () => { err.textContent = ''; if (!(await attempt(pw.value, true))) err.textContent = '비밀번호가 맞지 않습니다.'; };
  document.getElementById('go').addEventListener('click', submit);
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  pw.focus();
})();
